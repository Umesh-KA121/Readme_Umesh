<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img"><rect width="1200" height="190" rx="20" fill="#EDE3D5"/><text x="70" y="65" fill="#A97852" font-family="ui-monospace,monospace" font-size="15" letter-spacing="3">07 — LET’S CONNECT</text><text x="70" y="124" fill="#2F2924" font-family="Georgia,serif" font-size="42">Have an idea? I’d be glad to hear from you.</text><text x="72" y="158" fill="#6F6257" font-family="Arial,sans-serif" font-size="18">Find my work, say hello, or follow along as I learn and build.</text></svg>
