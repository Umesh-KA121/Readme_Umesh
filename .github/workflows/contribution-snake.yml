name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate warm contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Umesh-KA121
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23A97852&color_dots=%23EDE3D5,%23D5C6B5,%23C6AC94,%23A97852,%23463A31
      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
